version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: task_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: task_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
