services:
  postgres:
    image: postgres:15
    container_name: task_postgres

    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb

    ports:
      - "5432:5432"

    volumes:
      - task_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: task_redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: task_migrate

    command: ["alembic", "upgrade", "head"]

    environment:
      DATABASE_URL: postgresql+asyncpg://taskuser:taskpass@postgres:5432/taskdb
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: task_api

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

    environment:
      DATABASE_URL: postgresql+asyncpg://taskuser:taskpass@postgres:5432/taskdb
      REDIS_URL: redis://redis:6379

    ports:
      - "8000:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: task_worker

    command: ["python", "-m", "app.workers"]

    environment:
      DATABASE_URL: postgresql+asyncpg://taskuser:taskpass@postgres:5432/taskdb
      REDIS_URL: redis://redis:6379

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  task_postgres_data:
